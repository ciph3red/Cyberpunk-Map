name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/wigle-map run build
        env:
          NODE_ENV: production
          PORT: "4173"
          BASE_PATH: "/"
          VITE_API_BASE_URL: ${{ secrets.FRONTEND_API_BASE_URL }}

      - name: Deploy frontend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FRONTEND_HOST: ${{ secrets.FRONTEND_HOST }}
          FRONTEND_USER: ${{ secrets.FRONTEND_USER }}
          FRONTEND_KEY: ${{ secrets.FRONTEND_KEY }}
          FRONTEND_API_BASE_URL: ${{ secrets.FRONTEND_API_BASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "$FRONTEND_API_BASE_URL" ]; then
            echo "FRONTEND_API_BASE_URL not set. Deployment will continue; users can configure API URL in-app."
          fi

          mkdir -p ~/.ssh
          KEY_FILE="$HOME/.ssh/frontend_deploy_key"
          REMOTE_STAGE_DIR="/tmp/frontend-stage"

          if printf '%s' "$FRONTEND_KEY" | grep -q "BEGIN .* PRIVATE KEY"; then
            printf '%s\n' "$FRONTEND_KEY" > "$KEY_FILE"
          elif printf '%s' "$FRONTEND_KEY" | grep -q '^ssh-'; then
            echo "FRONTEND_KEY looks like a public key. Please store the private key in the FRONTEND_KEY secret."
            exit 1
          else
            printf '%s' "$FRONTEND_KEY" | base64 -d > "$KEY_FILE" 2>/dev/null || {
              echo "FRONTEND_KEY is not valid private key text or base64 private key."
              exit 1
            }
          fi

          chmod 600 "$KEY_FILE"
          ssh-keyscan -p 8123 "$FRONTEND_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          if [ ! -f artifacts/wigle-map/dist/public/index.html ]; then
            echo "Frontend build output missing: artifacts/wigle-map/dist/public/index.html"
            exit 1
          fi

          ssh -p 8123 -i "$KEY_FILE" -o StrictHostKeyChecking=accept-new \
            "$FRONTEND_USER@$FRONTEND_HOST" \
            "rm -rf '$REMOTE_STAGE_DIR' && mkdir -p '$REMOTE_STAGE_DIR'"

          scp -P 8123 -i "$KEY_FILE" -o StrictHostKeyChecking=accept-new -r \
            artifacts/wigle-map/dist/public/. \
            "$FRONTEND_USER@$FRONTEND_HOST:$REMOTE_STAGE_DIR/"

      - name: Promote frontend files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.FRONTEND_HOST }}
          port: 8123
          username: ${{ secrets.FRONTEND_USER }}
          key: ${{ secrets.FRONTEND_KEY }}
          script: |
            set -e
            DEPLOY_DIR="/var/www/html"

            SUDO=""
            if [ ! -w "$DEPLOY_DIR" ] && [ ! -w "$(dirname "$DEPLOY_DIR")" ]; then
              if command -v sudo >/dev/null 2>&1; then
                SUDO="sudo"
              else
                echo "No write access to $DEPLOY_DIR and sudo is unavailable"
                exit 1
              fi
            fi

            SRC_DIR="/tmp/frontend-stage"
            if [ ! -d "$SRC_DIR" ]; then
              echo "Uploaded frontend files not found at $SRC_DIR"
              exit 1
            fi

            $SUDO mkdir -p "$DEPLOY_DIR"
            if command -v rsync >/dev/null 2>&1; then
              $SUDO rsync -av --delete "$SRC_DIR/" "$DEPLOY_DIR/"
            else
              $SUDO find "$DEPLOY_DIR" -mindepth 1 -delete
              $SUDO cp -a "$SRC_DIR/." "$DEPLOY_DIR/"
            fi

  backend:
    name: Backend Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm --filter @workspace/api-server run build

      - name: Upload backend bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ${{ secrets.BACKEND_USER }}
          key: ${{ secrets.BACKEND_KEY }}
          source: "artifacts/api-server/dist/*"
          target: "~/api-server-dist"

      - name: Restart backend service
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ${{ secrets.BACKEND_USER }}
          key: ${{ secrets.BACKEND_KEY }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.BACKEND_DEPLOY_DIR }}"
            if [ -z "$DEPLOY_DIR" ]; then DEPLOY_DIR="/var/www/backend"; fi

            SUDO=""
            if [ ! -w "$DEPLOY_DIR" ] && [ ! -w "$(dirname "$DEPLOY_DIR")" ]; then
              if command -v sudo >/dev/null 2>&1; then
                SUDO="sudo"
              else
                echo "No write access to $DEPLOY_DIR and sudo is unavailable"
                exit 1
              fi
            fi

            SRC_DIR="$HOME/api-server-dist"
            if [ -d "$SRC_DIR/artifacts/api-server/dist" ]; then
              SRC_DIR="$SRC_DIR/artifacts/api-server/dist"
            fi

            if [ ! -d "$SRC_DIR" ]; then
              echo "Uploaded backend bundle not found at expected path"
              exit 1
            fi

            $SUDO mkdir -p "$DEPLOY_DIR/dist"
            if command -v rsync >/dev/null 2>&1; then
              $SUDO rsync -av --delete "$SRC_DIR/" "$DEPLOY_DIR/dist/"
            else
              $SUDO find "$DEPLOY_DIR/dist" -mindepth 1 -delete
              $SUDO cp -a "$SRC_DIR/." "$DEPLOY_DIR/dist/"
            fi

            cd "$DEPLOY_DIR"
            export PORT='${{ secrets.BACKEND_PORT }}'
            if [ -z "$PORT" ]; then PORT=3000; fi
            export WIGLE_API_NAME='${{ secrets.WIGLE_API_NAME }}'
            export WIGLE_API_TOKEN='${{ secrets.WIGLE_API_TOKEN }}'

            if ! command -v pm2 >/dev/null 2>&1; then
              if command -v npm >/dev/null 2>&1; then
                if [ -n "$SUDO" ]; then
                  $SUDO npm install -g pm2
                else
                  npm install -g pm2
                fi
                export PATH="$PATH:$(npm prefix -g)/bin"
              fi
            fi

            if ! command -v pm2 >/dev/null 2>&1; then
              echo "pm2 is not installed and could not be installed automatically"
              exit 1
            fi

            if pm2 describe api-server >/dev/null 2>&1; then
              pm2 restart api-server --update-env
            else
              pm2 start dist/index.mjs --name api-server --update-env
            fi

            pm2 save